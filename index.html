<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookTwoLang — AI document translation</title>
    <meta name="description" content="Drop a document, get a translation. 30+ languages, powered by Gemini." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23111111'/><path d='M16 20 L48 20 M16 32 L48 32 M16 44 L36 44' stroke='%232dd4bf' stroke-width='4' stroke-linecap='round'/></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488' },
            },
            fontFamily: {
              sans: ['"Inter"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 200ms ease-out',
              'slide-up': 'slideUp 240ms cubic-bezier(0.16,1,0.3,1)',
              'pulse-soft': 'pulseSoft 1.6s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: { from: { opacity: 0 }, to: { opacity: 1 } },
              slideUp: { from: { opacity: 0, transform: 'translateY(6px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
              pulseSoft: { '0%,100%': { opacity: 0.4 }, '50%': { opacity: 1 } },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      html, body { background: #0a0a0a; color: #fafafa; }
      body {
        background-image:
          radial-gradient(800px 400px at 75% -10%, rgba(45,212,191,0.06), transparent 60%),
          radial-gradient(900px 500px at 10% 110%, rgba(45,212,191,0.04), transparent 60%);
        background-attachment: fixed;
        min-height: 100vh;
        font-feature-settings: 'cv11','ss01','ss03';
      }
      .glass { background: rgba(10,10,10,0.7); backdrop-filter: saturate(160%) blur(10px); }
      .scrollbar::-webkit-scrollbar { width: 10px; height: 10px; }
      .scrollbar::-webkit-scrollbar-track { background: transparent; }
      .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
      .scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,0.16); }
      [hidden] { display: none !important; }

      .dropzone { transition: border-color 200ms ease, background-color 200ms ease, transform 200ms ease; }
      .dropzone.is-dragging { border-color: rgb(45,212,191); background-color: rgba(45,212,191,0.06); transform: scale(1.01); }
      .dropzone.is-uploading { border-style: solid; border-color: rgb(45,212,191); }

      .doc-card { transition: border-color 180ms ease, background-color 180ms ease; }
      .doc-card:hover { border-color: rgba(255,255,255,0.18); background-color: rgba(255,255,255,0.03); }

      .spinner {
        width: 12px; height: 12px; border-radius: 999px;
        border: 2px solid rgba(255,255,255,0.18);
        border-top-color: rgb(45,212,191);
        animation: spin 700ms linear infinite;
        display: inline-block; vertical-align: -2px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: right 0.5rem center; background-size: 14px; appearance: none; -webkit-appearance: none; padding-right: 1.75rem; }

      .lang-picker {
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
        color: rgb(245,245,245); border-radius: 9999px; padding: 6px 32px 6px 14px; font-size: 13px;
        font-weight: 500; cursor: pointer;
      }
      .lang-picker:hover { background: rgba(255,255,255,0.08); }
    </style>
  </head>
  <body class="font-sans antialiased">
    <header class="sticky top-0 z-30 glass border-b border-white/[0.06]">
      <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between gap-4">
        <a href="/" class="flex items-center gap-2.5 text-white font-semibold tracking-tight">
          <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-zinc-900 border border-white/[0.08]">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="text-brand-400"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </span>
          BookTwoLang
        </a>
        <nav id="nav-actions" class="flex items-center gap-2 text-sm"></nav>
      </div>
    </header>

    <!-- ===================== AUTH ===================== -->
    <section id="view-auth" class="min-h-[calc(100vh-3.5rem)] grid place-items-center px-6 py-12">
      <div class="w-full max-w-sm animate-fade-in">
        <div class="text-center mb-8">
          <h1 class="text-3xl font-semibold tracking-tight text-white">Translate any document.</h1>
          <p class="mt-2 text-zinc-400 text-sm">30+ languages. Books welcome.</p>
        </div>

        <div class="bg-white/[0.02] border border-white/[0.08] rounded-2xl p-6">
          <div class="flex items-center gap-1 mb-5 text-sm bg-black/30 border border-white/[0.06] rounded-lg p-1">
            <button id="tab-login" type="button" class="flex-1 px-3 py-1.5 rounded-md text-white bg-white/[0.06]">Log in</button>
            <button id="tab-signup" type="button" class="flex-1 px-3 py-1.5 rounded-md text-zinc-400 hover:text-white transition-colors">Sign up</button>
          </div>

          <form id="form-login" class="space-y-3" onsubmit="event.preventDefault(); window.handleLogin();">
            <input name="email" type="email" required autocomplete="email" placeholder="Email"
              class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/[0.08] text-white placeholder:text-zinc-500 outline-none focus:border-brand-400 transition-colors" />
            <input name="password" type="password" required autocomplete="current-password" placeholder="Password"
              class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/[0.08] text-white placeholder:text-zinc-500 outline-none focus:border-brand-400 transition-colors" />
            <button type="submit" class="w-full mt-1 px-4 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-400 text-zinc-950 font-semibold transition-colors">Log in</button>
            <p id="login-error" class="text-sm text-red-400 text-center" hidden></p>
          </form>

          <form id="form-signup" class="space-y-3" hidden onsubmit="event.preventDefault(); window.handleSignup();">
            <input name="displayName" type="text" maxlength="80" placeholder="Display name (optional)"
              class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/[0.08] text-white placeholder:text-zinc-500 outline-none focus:border-brand-400 transition-colors" />
            <input name="email" type="email" required autocomplete="email" placeholder="Email"
              class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/[0.08] text-white placeholder:text-zinc-500 outline-none focus:border-brand-400 transition-colors" />
            <input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Password (min 8 chars)"
              class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/[0.08] text-white placeholder:text-zinc-500 outline-none focus:border-brand-400 transition-colors" />
            <button type="submit" class="w-full mt-1 px-4 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-400 text-zinc-950 font-semibold transition-colors">Create account</button>
            <p id="signup-error" class="text-sm text-red-400 text-center" hidden></p>
          </form>
        </div>

        <p class="mt-4 text-center text-xs text-zinc-500">Powered by Gemini. Files stay in your account.</p>
      </div>
    </section>

    <!-- ===================== APP ===================== -->
    <section id="view-app" hidden>
      <div class="max-w-5xl mx-auto px-6 pt-12 pb-24">
        <!-- HERO -->
        <div class="animate-fade-in">
          <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-6">
            <h1 class="text-3xl md:text-4xl font-semibold tracking-tight text-white">Translate to</h1>
            <div class="relative">
              <select id="global-target-lang" class="lang-picker text-base md:text-lg font-semibold"></select>
            </div>
          </div>

          <!-- DROPZONE -->
          <div id="dropzone" class="dropzone relative rounded-2xl border-2 border-dashed border-white/[0.12] bg-white/[0.015] p-10 md:p-12 text-center cursor-pointer group">
            <input id="file-input" type="file" accept=".txt,.docx" multiple class="absolute inset-0 opacity-0 cursor-pointer" />
            <div class="pointer-events-none">
              <div class="mx-auto mb-4 w-12 h-12 rounded-2xl bg-white/[0.04] border border-white/[0.08] grid place-items-center group-hover:border-brand-400/40 transition-colors">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-brand-400">
                  <path d="M12 3v14"/><path d="M5 10l7-7 7 7"/><path d="M5 21h14"/>
                </svg>
              </div>
              <p class="text-white font-medium">Drop a document to translate</p>
              <p class="mt-1 text-sm text-zinc-400">or click to choose — <span class="font-mono text-xs">.txt</span> or <span class="font-mono text-xs">.docx</span>, up to 5&nbsp;MB</p>
            </div>
          </div>

          <!-- PASTE TOGGLE -->
          <div class="mt-3 flex items-center justify-center gap-3 text-xs text-zinc-500">
            <span class="h-px flex-1 bg-white/[0.06]"></span>
            <button id="toggle-paste" type="button" class="hover:text-zinc-300 transition-colors">or paste text instead</button>
            <span class="h-px flex-1 bg-white/[0.06]"></span>
          </div>

          <div id="paste-panel" hidden class="mt-4 bg-white/[0.02] border border-white/[0.08] rounded-2xl p-4 animate-slide-up">
            <textarea id="paste-text" rows="6" placeholder="Paste any text — a paragraph, a chapter, a chat log…"
              class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/[0.08] text-white placeholder:text-zinc-500 outline-none focus:border-brand-400 transition-colors scrollbar text-sm leading-relaxed"></textarea>
            <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2 text-xs text-zinc-400">
                <span>Source</span>
                <select id="paste-source-lang" class="px-2 py-1 rounded-lg bg-black/40 border border-white/[0.08] text-white text-xs">
                  <option value="auto">Auto-detect</option>
                </select>
              </div>
              <button id="paste-translate" type="button" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-400 text-zinc-950 text-sm font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Translate</button>
            </div>
          </div>
        </div>

        <!-- HISTORY -->
        <div class="mt-14">
          <div class="flex items-end justify-between mb-4">
            <h2 class="text-sm uppercase tracking-[0.12em] text-zinc-500 font-medium">Your translations</h2>
            <span id="history-count" class="text-xs text-zinc-500 font-mono"></span>
          </div>

          <div id="doc-cards" class="grid grid-cols-1 gap-3"></div>

          <div id="empty-state" class="text-center py-16 text-zinc-500 text-sm" hidden>
            Nothing yet. Drop a file above to begin.
          </div>
        </div>
      </div>
    </section>

    <!-- Toast container -->
    <div id="toasts" class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"></div>

    <script src="/public/assets/js/app.js"></script>
  </body>
</html>
